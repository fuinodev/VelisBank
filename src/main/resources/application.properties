spring.application.name=VelisBank
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/velisbank}
spring.datasource.username=${DB_USERNAME:velisbank}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
velisbank.seed-demo=false
velisbank.admin.username=${ADMIN_USERNAME:admin}
velisbank.admin.password=${ADMIN_PASSWORD:}
